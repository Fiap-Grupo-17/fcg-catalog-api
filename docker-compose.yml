version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: fcg-postgres-catalog
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: fcg_db
      POSTGRES_USER: fcg_user
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
    volumes:
      - pgdata_catalog:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fcg_user -d fcg_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: fcg-rabbitmq-catalog
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: fcg-redis-catalog
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  mongo:
    image: mongo:7
    container_name: fcg-mongo-catalog
    ports:
      - "27017:27017"
    volumes:
      - mongodata_catalog:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Busca avançada (TC4, item 3) — mesma imagem/versão usada no AKS (k8s/14-elasticsearch.yaml)
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.3
    container_name: fcg-elasticsearch-catalog
    ports:
      - "9200:9200"
    environment:
      discovery.type: single-node
      cluster.name: fcg-search
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: "${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no arquivo .env}"
    volumes:
      - esdata_catalog:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -s -f -u elastic:$${ELASTIC_PASSWORD} 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' > /dev/null"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  catalog-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fcg-catalog-api
    ports:
      - "8082:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ConnectionStrings__Postgres: "Host=postgres;Database=fcg_db;Username=fcg_user;Password=${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no arquivo .env}"
      Jwt__Secret: "${JWT_SECRET:?Defina JWT_SECRET no arquivo .env}"
      Jwt__Issuer: "fcg-users-api"
      Jwt__Audience: "fcg-platform"
      RabbitMQ__Host: rabbitmq
      RabbitMQ__VirtualHost: /
      RabbitMQ__Username: guest
      RabbitMQ__Password: "${RABBITMQ_PASSWORD:?Defina RABBITMQ_PASSWORD no arquivo .env}"
      Redis__ConnectionString: "redis:6379"
      Mongo__ConnectionString: "mongodb://mongo:27017"
      Mongo__Database: "fcg_catalog"
      Elasticsearch__Url: "http://elasticsearch:9200"
      Elasticsearch__Username: "elastic"
      Elasticsearch__Password: "${ELASTIC_PASSWORD:?Defina ELASTIC_PASSWORD no arquivo .env}"
      Elasticsearch__IndexName: "jogos"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      mongo:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  pgdata_catalog:
  mongodata_catalog:
  esdata_catalog:
