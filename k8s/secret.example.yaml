apiVersion: v1
kind: Secret
metadata:
  name: catalog-api-secrets
  namespace: fcg
type: Opaque
stringData:
  Jwt__Secret: "<mesmo-valor-do-users-api-minimo-32-caracteres>"
  ConnectionStrings__Postgres: "Host=postgres-service;Database=fcg_db;Username=fcg_user;Password=<senha-postgres>"
  RabbitMQ__Password: "<senha-rabbitmq>"
  Mongo__ConnectionString: "mongodb://mongo-service:27017"