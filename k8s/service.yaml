apiVersion: v1
kind: Service
metadata:
  name: catalog-api-service
  namespace: fcg
  labels:
    app: catalog-api
spec:
  selector:
    app: catalog-api
  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: catalog-api-nodeport
  namespace: fcg
spec:
  selector:
    app: catalog-api
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30082
  type: NodePort
